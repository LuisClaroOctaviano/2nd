<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Yrsa&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>2nd Date</title>
</head>
<body>
  <main class="page">
    <h1>What do you want to do?</h1>

    <div class="selection-area">
      <label for="activity-selected">Choose an activity</label>
      <select id="activity-selected">
        <option value="" selected>Choose an activity</option>
        <option value="Rug Tufting">Rug Tufting</option>
        <option value="Ceramic Painting">Ceramic Painting</option>
        <option value="Clay Pottery">Clay Pottery</option>
      </select>
    </div>

    <div id="activity-result"></div>

    <button id="submit-selection" type="button">Continue </button>
    <div id="selection-message"></div>
  </main>

  <script src="script2.js"></script>
</body>
</html>
